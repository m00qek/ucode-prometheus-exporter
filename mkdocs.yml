site_name: ucode-prometheus-exporter
site_description: Metrics of OpenWrt for Prometheus, written in ucode and served by uhttpd.
site_url: https://m00qek.github.io/ucode-prometheus-exporter/
repo_url: https://github.com/m00qek/ucode-prometheus-exporter
repo_name: m00qek/ucode-prometheus-exporter
site_dir: bin/site

exclude_docs: |
  README.md
  Makefile
  overrides/
  gen/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Welcome: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Monitor a Router with Prometheus: tutorials/monitor-a-router.md
      - Write Your First Collector: tutorials/first-collector.md
  - How-to Guides:
      - Overview: how-to/index.md
      - Operators:
          - Installing the Exporter: how-to/install.md
          - Upgrading the Exporter: how-to/upgrade.md
          - Removing the Exporter: how-to/uninstall.md
          - Moving from the Feed's Exporters: how-to/migrate-from-feed.md
          - Choosing Collectors: how-to/choose-collectors.md
          - Listening on the LAN: how-to/listen-on-lan.md
          - Serving HTTPS with Basic Auth: how-to/https-basic-auth.md
          - Compressing Scrapes: how-to/gzip.md
          - Giving Programs More Time: how-to/exec-timeout.md
          - Setting a Collector's Options: how-to/collector-options.md
          - Publishing Metrics from Scripts: how-to/textfile.md
          - Pushing Metrics from the Router: how-to/push-metrics.md
          - Monitoring Unbound: how-to/unbound.md
          - Monitoring chrony: how-to/chrony.md
          - Monitoring SQM and CAKE: how-to/sqm-cake.md
          - Using the LuCI App: how-to/luci.md
