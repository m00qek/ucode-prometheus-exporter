site_name: ucode-prometheus-exporter
site_description: Metrics of OpenWrt for Prometheus, written in ucode and served by uhttpd.
site_url: https://m00qek.github.io/ucode-prometheus-exporter/
repo_url: https://github.com/m00qek/ucode-prometheus-exporter
repo_name: m00qek/ucode-prometheus-exporter
site_dir: bin/site

exclude_docs: |
  README.md
  Makefile
  overrides/
  gen/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Welcome: index.md
