name: ci

on:
  push:
  pull_request:

# Each job's timeout-minutes is a few times what it takes with its images
# built and cached (test 1.5 min, monitoring 1, bench 0.5, e2e 6, browser 3), so a hang
# fails the job instead of holding the runner for GitHub's 6 hours.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The first 25.12 release is the API floor; the latest catches regressions.
        openwrt: [ '25.12.0', '25.12.5' ]
    env:
      CI: 1
      OPENWRT_VERSION: ${{ matrix.openwrt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make lint
      - run: make test
      - run: make package-check

  # The alerting rules and dashboards of monitoring/: their metrics against the
  # reference, promtool and vmalert on the rules and their tests, percli lint.
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make monitoring-check

  # The packages as packages.ucode.dev builds them, from a tarball of the tree,
  # which must hold what make package builds.
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make feed-check

  # Each collector and whole scrapes on generated worlds, held to the budgets
  # of test/bench/budgets.uc: scaling, memory, and generous times.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make bench
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench
          path: bin/bench/*.json

  # The packages under procd in a privileged container; GitHub's runners allow it.
  # On 25.12.0 a failure does not fail the run: there, about a third of the runs
  # on GitHub's runners, and none elsewhere so far, lose rpcd partway through,
  # which then answers nothing, for a cause not yet found. The e2e's first
  # failure says what rpcd and ubusd were doing.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.openwrt == '25.12.0' }}
    strategy:
      fail-fast: false
      matrix:
        openwrt: [ '25.12.0', '25.12.5' ]
    env:
      CI: 1
      OPENWRT_VERSION: ${{ matrix.openwrt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make e2e

  # ---- luci-app-prometheus-exporter ----
  # The LuCI pages in a browser, against the built packages and the plugin in a real rpcd.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser
          path: bin/browser
