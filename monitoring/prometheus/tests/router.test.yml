# promtool test rules (make monitoring-check): the router's rules on made-up
# series, a sample a minute, each rule firing where it should and quiet where
# it should not. The routers are in jobs of any name, and write this
# exporter's build_info; a Linux server's node_exporter, which writes the
# same families but no build_info, fires none of them.

rule_files:
  - ../router.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'ucode_prometheus_exporter_build_info{job="node-remote", instance="router:9100", version="0.3.0-r1"}'
        values: '1x40'
      - series: 'ucode_prometheus_exporter_build_info{job="access-points", instance="ap:9100", version="0.3.0-r1"}'
        values: '1x40'
      # conntrack: 90% full; another router at 50%.
      - series: 'node_nf_conntrack_entries{job="node-remote", instance="router:9100"}'
        values: '14745x20'
      - series: 'node_nf_conntrack_entries_limit{job="node-remote", instance="router:9100"}'
        values: '16384x20'
      - series: 'node_nf_conntrack_entries{job="access-points", instance="ap:9100"}'
        values: '8192x20'
      - series: 'node_nf_conntrack_entries_limit{job="access-points", instance="ap:9100"}'
        values: '16384x20'
      # A Linux server's node_exporter, as full and as short of memory.
      - series: 'node_nf_conntrack_entries{job="node-local", instance="server:9100"}'
        values: '14745x20'
      - series: 'node_nf_conntrack_entries_limit{job="node-local", instance="server:9100"}'
        values: '16384x20'
      - series: 'node_memory_MemAvailable_bytes{job="node-local", instance="server:9100"}'
        values: '6553600x20'
      - series: 'node_memory_MemTotal_bytes{job="node-local", instance="server:9100"}'
        values: '131072000x20'
      # meminfo: 5% available.
      - series: 'node_memory_MemAvailable_bytes{job="node-remote", instance="router:9100"}'
        values: '6553600x20'
      - series: 'node_memory_MemTotal_bytes{job="node-remote", instance="router:9100"}'
        values: '131072000x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: OpenWrtConntrackTableNearlyFull
        exp_alerts: []
      - eval_time: 15m
        alertname: OpenWrtConntrackTableNearlyFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-remote
              instance: router:9100
            exp_annotations:
              summary: The connection table of router:9100 is 90% full.
              description: >-
                The conntrack table of router:9100 has been more than 80% full for 10 minutes.
                When it is full the router drops new connections. Raise net.netfilter.nf_conntrack_max,
                or find the host that opens them.
      - eval_time: 15m
        alertname: OpenWrtMemoryLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-remote
              instance: router:9100
            exp_annotations:
              summary: router:9100 has 5% of its memory available.
              description: >-
                Less than 10% of the memory of router:9100 has been available for 10 minutes.
                /tmp is memory too: a full /tmp, or a large log, takes it.

  - interval: 1m
    input_series:
      - series: 'ucode_prometheus_exporter_build_info{job="node-remote", instance="router:9100", version="0.3.0-r1"}'
        values: '1x40'
      - series: 'ucode_prometheus_exporter_build_info{job="access-points", instance="ap:9100", version="0.3.0-r1"}'
        values: '1x40'
      # The overlay 5% available, the squashfs root full and read-only, /tmp
      # half used.
      - series: 'node_filesystem_avail_bytes{job="node-remote", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '1000000x20'
      - series: 'node_filesystem_size_bytes{job="node-remote", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '20000000x20'
      - series: 'node_filesystem_readonly{job="node-remote", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '0x20'
      - series: 'node_filesystem_avail_bytes{job="node-remote", instance="router:9100", device="/dev/root", fstype="squashfs", mountpoint="/rom"}'
        values: '0x20'
      - series: 'node_filesystem_size_bytes{job="node-remote", instance="router:9100", device="/dev/root", fstype="squashfs", mountpoint="/rom"}'
        values: '5000000x20'
      - series: 'node_filesystem_readonly{job="node-remote", instance="router:9100", device="/dev/root", fstype="squashfs", mountpoint="/rom"}'
        values: '1x20'
      - series: 'node_filesystem_avail_bytes{job="node-remote", instance="router:9100", device="tmpfs", fstype="tmpfs", mountpoint="/tmp"}'
        values: '50000000x20'
      - series: 'node_filesystem_size_bytes{job="node-remote", instance="router:9100", device="tmpfs", fstype="tmpfs", mountpoint="/tmp"}'
        values: '100000000x20'
      - series: 'node_filesystem_readonly{job="node-remote", instance="router:9100", device="tmpfs", fstype="tmpfs", mountpoint="/tmp"}'
        values: '0x20'
      # A Linux server's node_exporter, its /var as full.
      - series: 'node_filesystem_avail_bytes{job="node-local", instance="server:9100", device="/dev/sda2", fstype="ext4", mountpoint="/var"}'
        values: '1000000x20'
      - series: 'node_filesystem_size_bytes{job="node-local", instance="server:9100", device="/dev/sda2", fstype="ext4", mountpoint="/var"}'
        values: '20000000x20'
      - series: 'node_filesystem_readonly{job="node-local", instance="server:9100", device="/dev/sda2", fstype="ext4", mountpoint="/var"}'
        values: '0x20'
      # Inodes: the overlay 5% free; a jffs2 that reports none.
      - series: 'node_filesystem_files_free{job="node-remote", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '500x20'
      - series: 'node_filesystem_files{job="node-remote", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '10000x20'
      - series: 'node_filesystem_files_free{job="node-remote", instance="router:9100", device="/dev/mtdblock6", fstype="jffs2", mountpoint="/mnt/data"}'
        values: '0x20'
      - series: 'node_filesystem_files{job="node-remote", instance="router:9100", device="/dev/mtdblock6", fstype="jffs2", mountpoint="/mnt/data"}'
        values: '0x20'
      - series: 'node_filesystem_readonly{job="node-remote", instance="router:9100", device="/dev/mtdblock6", fstype="jffs2", mountpoint="/mnt/data"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenWrtFilesystemNearlyFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-remote
              instance: router:9100
              device: /dev/ubi0_1
              fstype: ubifs
              mountpoint: /overlay
            exp_annotations:
              summary: /overlay on router:9100 has 5% of its space left.
              description: >-
                The filesystem at /overlay (/dev/ubi0_1, ubifs) on router:9100
                has had less than 10% of its space available for 15 minutes. On the overlay, packages and
                settings stop being written once it is full.
      - eval_time: 20m
        alertname: OpenWrtFilesystemOutOfInodes
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-remote
              instance: router:9100
              device: /dev/ubi0_1
              fstype: ubifs
              mountpoint: /overlay
            exp_annotations:
              summary: /overlay on router:9100 has 5% of its inodes left.
              description: >-
                The filesystem at /overlay (/dev/ubi0_1) on router:9100 has had less
                than 10% of its inodes free for 15 minutes: many small files, as a growing cache or spool.

  - interval: 1m
    input_series:
      - series: 'ucode_prometheus_exporter_build_info{job="node-remote", instance="router:9100", version="0.3.0-r1"}'
        values: '1x40'
      - series: 'ucode_prometheus_exporter_build_info{job="access-points", instance="ap:9100", version="0.3.0-r1"}'
        values: '1x40'
      # A radio past its max, another past its crit, a chip with no limits
      # (0), a CPU thermal zone past its passive trip point, and zones 8, 30
      # and 20 degrees below their critical trip points, and one without one.
      - series: 'node_hwmon_temp_celsius{job="access-points", instance="ap:9100", chip="mt7915_phy0", sensor="temp1"}'
        values: '110x10'
      - series: 'node_hwmon_temp_max_celsius{job="access-points", instance="ap:9100", chip="mt7915_phy0", sensor="temp1"}'
        values: '105x10'
      - series: 'node_hwmon_temp_crit_celsius{job="access-points", instance="ap:9100", chip="mt7915_phy0", sensor="temp1"}'
        values: '120x10'
      - series: 'node_hwmon_temp_celsius{job="access-points", instance="ap:9100", chip="mt7915_phy1", sensor="temp1"}'
        values: '121x10'
      - series: 'node_hwmon_temp_max_celsius{job="access-points", instance="ap:9100", chip="mt7915_phy1", sensor="temp1"}'
        values: '105x10'
      - series: 'node_hwmon_temp_crit_celsius{job="access-points", instance="ap:9100", chip="mt7915_phy1", sensor="temp1"}'
        values: '120x10'
      - series: 'node_hwmon_temp_celsius{job="access-points", instance="ap:9100", chip="soc", sensor="temp1"}'
        values: '50x10'
      - series: 'node_hwmon_temp_max_celsius{job="access-points", instance="ap:9100", chip="soc", sensor="temp1"}'
        values: '0x10'
      # A Linux server's node_exporter, its CPU past its crit.
      - series: 'node_hwmon_temp_celsius{job="node-local", instance="server:9100", chip="platform_coretemp_0", sensor="temp1"}'
        values: '101x10'
      - series: 'node_hwmon_temp_max_celsius{job="node-local", instance="server:9100", chip="platform_coretemp_0", sensor="temp1"}'
        values: '80x10'
      - series: 'node_hwmon_temp_crit_celsius{job="node-local", instance="server:9100", chip="platform_coretemp_0", sensor="temp1"}'
        values: '100x10'
      - series: 'node_thermal_zone_temp{job="access-points", instance="ap:9100", zone="0", type="cpu-thermal"}'
        values: '86x10'
      - series: 'node_thermal_zone_passive_celsius{job="access-points", instance="ap:9100", zone="0", type="cpu-thermal"}'
        values: '85x10'
      - series: 'node_thermal_zone_temp{job="node-remote", instance="router:9100", zone="0", type="cpu-thermal"}'
        values: '117x10'
      - series: 'node_thermal_zone_critical_celsius{job="node-remote", instance="router:9100", zone="0", type="cpu-thermal"}'
        values: '125x10'
      - series: 'node_thermal_zone_temp{job="node-remote", instance="router:9100", zone="1", type="wifi-thermal"}'
        values: '95x10'
      - series: 'node_thermal_zone_critical_celsius{job="node-remote", instance="router:9100", zone="1", type="wifi-thermal"}'
        values: '125x10'
      - series: 'node_thermal_zone_temp{job="node-remote", instance="router:9100", zone="2", type="ddr-thermal"}'
        values: '120x10'
      - series: 'node_thermal_zone_temp{job="node-local", instance="server:9100", zone="0", type="x86_pkg_temp"}'
        values: '90x10'
      - series: 'node_thermal_zone_critical_celsius{job="node-local", instance="server:9100", zone="0", type="x86_pkg_temp"}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: OpenWrtTemperatureAboveMax
        exp_alerts:
          - exp_labels:
              severity: warning
              job: access-points
              instance: ap:9100
              chip: mt7915_phy0
              sensor: temp1
            exp_annotations:
              summary: Sensor temp1 of mt7915_phy0 on ap:9100 is at its maximum.
              description: >-
                Sensor temp1 of chip mt7915_phy0 on ap:9100 has read
                110 °C, at or above the chip's maximum, for 5 minutes. Check the airflow.
          - exp_labels:
              severity: warning
              job: access-points
              instance: ap:9100
              chip: mt7915_phy1
              sensor: temp1
            exp_annotations:
              summary: Sensor temp1 of mt7915_phy1 on ap:9100 is at its maximum.
              description: >-
                Sensor temp1 of chip mt7915_phy1 on ap:9100 has read
                121 °C, at or above the chip's maximum, for 5 minutes. Check the airflow.
      - eval_time: 2m
        alertname: OpenWrtTemperatureCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: access-points
              instance: ap:9100
              chip: mt7915_phy1
              sensor: temp1
            exp_annotations:
              summary: Sensor temp1 of mt7915_phy1 on ap:9100 is at its critical temperature.
              description: >-
                Sensor temp1 of chip mt7915_phy1 on ap:9100 reads 121 °C,
                at or above the chip's critical temperature: the hardware may shut down.
      - eval_time: 6m
        alertname: OpenWrtThermalZoneThrottling
        exp_alerts:
          - exp_labels:
              severity: warning
              job: access-points
              instance: ap:9100
              zone: "0"
              type: cpu-thermal
            exp_annotations:
              summary: Thermal zone 0 (cpu-thermal) on ap:9100 is throttling.
              description: >-
                Thermal zone 0 (cpu-thermal) on ap:9100 has been at or above
                its passive trip point for 5 minutes, at 86 °C: the kernel slows the CPU to cool it.
      - eval_time: 3m
        alertname: OpenWrtThermalZoneNearCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node-remote
              instance: router:9100
              zone: "0"
              type: cpu-thermal
            exp_annotations:
              summary: Thermal zone 0 (cpu-thermal) on router:9100 is near its critical temperature.
              description: >-
                Thermal zone 0 (cpu-thermal) on router:9100 has been within 10 °C
                of its critical trip point for a minute, at 117 °C: the kernel shuts the router down at it.

  - interval: 1m
    input_series:
      - series: 'ucode_prometheus_exporter_build_info{job="node-remote", instance="router:9100", version="0.3.0-r1"}'
        values: '1x40'
      - series: 'ucode_prometheus_exporter_build_info{job="access-points", instance="ap:9100", version="0.3.0-r1"}'
        values: '1x40'
      # wan down, lan up.
      - series: 'node_openwrt_interface_up{job="node-remote", instance="router:9100", interface="wan"}'
        values: '1 0x10'
      - series: 'node_openwrt_interface_up{job="node-remote", instance="router:9100", interface="lan"}'
        values: '1x10'
      # radio0 is up, radio1 enabled and down, radio2 disabled on purpose.
      - series: 'node_wifi_radio_up{job="access-points", instance="ap:9100", radio="radio0"}'
        values: '1x40'
      - series: 'node_wifi_radio_disabled{job="access-points", instance="ap:9100", radio="radio0"}'
        values: '0x40'
      - series: 'node_wifi_radio_up{job="access-points", instance="ap:9100", radio="radio1"}'
        values: '0x40'
      - series: 'node_wifi_radio_disabled{job="access-points", instance="ap:9100", radio="radio1"}'
        values: '0x40'
      - series: 'node_wifi_radio_up{job="access-points", instance="ap:9100", radio="radio2"}'
        values: '0x40'
      - series: 'node_wifi_radio_disabled{job="access-points", instance="ap:9100", radio="radio2"}'
        values: '1x40'
      # ntpd never synchronized; chronyd elsewhere is.
      - series: 'node_timesync_synchronized{job="node-remote", instance="router:9100", daemon="ntpd"}'
        values: '0x40'
      - series: 'node_timesync_synchronized{job="access-points", instance="ap:9100", daemon="chronyd"}'
        values: '1x40'
      # 140 leases on lan, from dnsmasq and odhcpd, of a pool of 150; 12 on
      # guest, of 99; 19 on iot, of 20; many DHCPv6 bindings, which take no
      # pool; and 200 on an interface whose pool the exporter does not size.
      - series: 'node_openwrt_dhcp_pool_size{job="node-remote", instance="router:9100", interface="lan"}'
        values: '150x40'
      - series: 'node_openwrt_dhcp_pool_size{job="node-remote", instance="router:9100", interface="guest"}'
        values: '99x40'
      - series: 'node_openwrt_dhcp_pool_size{job="node-remote", instance="router:9100", interface="iot"}'
        values: '20x40'
      - series: 'node_openwrt_dhcp_leases{job="node-remote", instance="router:9100", server="dnsmasq", interface="iot", family="ipv4"}'
        values: '19x40'
      - series: 'node_openwrt_dhcp_leases{job="node-remote", instance="router:9100", server="dnsmasq", interface="lab", family="ipv4"}'
        values: '200x40'
      - series: 'node_openwrt_dhcp_leases{job="node-remote", instance="router:9100", server="dnsmasq", interface="lan", family="ipv4"}'
        values: '120x40'
      - series: 'node_openwrt_dhcp_leases{job="node-remote", instance="router:9100", server="odhcpd", interface="lan", family="ipv4"}'
        values: '20x40'
      - series: 'node_openwrt_dhcp_leases{job="node-remote", instance="router:9100", server="dnsmasq", interface="guest", family="ipv4"}'
        values: '12x40'
      - series: 'node_openwrt_dhcp_leases{job="node-remote", instance="router:9100", server="odhcpd", interface="lan", family="ipv6"}'
        values: '400x40'
    alert_rule_test:
      - eval_time: 7m
        alertname: OpenWrtWanDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node-remote
              instance: router:9100
              interface: wan
            exp_annotations:
              summary: Interface wan of router:9100 is down.
              description: >-
                The logical interface wan of router:9100 has been down for 5 minutes.
                `ifstatus wan` on the router says why; node_openwrt_interface_errors counts
                the errors netifd holds for it.
      - eval_time: 15m
        alertname: OpenWrtWifiRadioDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: access-points
              instance: ap:9100
              radio: radio1
            exp_annotations:
              summary: Wi-Fi radio radio1 of ap:9100 is down.
              description: >-
                Radio radio1 of ap:9100 is enabled and has not been up for 10 minutes:
                its driver failed, or it waits for a DFS channel check.
                `wifi status` on the router says which.
      - eval_time: 20m
        alertname: OpenWrtClockNotSynchronized
        exp_alerts: []
      - eval_time: 35m
        alertname: OpenWrtClockNotSynchronized
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-remote
              instance: router:9100
              daemon: ntpd
            exp_annotations:
              summary: The clock of router:9100 is not synchronized.
              description: >-
                ntpd on router:9100 has not had the clock synchronized for 30 minutes:
                no NTP server answers, or none is set.
      - eval_time: 20m
        alertname: OpenWrtDhcpPoolNearlyExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-remote
              instance: router:9100
              interface: lan
            exp_annotations:
              summary: The DHCP pool of lan on router:9100 is nearly exhausted.
              description: >-
                93.33% of the DHCPv4 pool of lan on router:9100
                is leased. A new client gets no address once the pool is spent: raise the interface's `limit`,
                or shorten its `leasetime`.
          - exp_labels:
              severity: warning
              job: node-remote
              instance: router:9100
              interface: iot
            exp_annotations:
              summary: The DHCP pool of iot on router:9100 is nearly exhausted.
              description: >-
                95% of the DHCPv4 pool of iot on router:9100
                is leased. A new client gets no address once the pool is spent: raise the interface's `limit`,
                or shorten its `leasetime`.
