# promtool test rules (make monitoring-check): the router's rules on made-up
# series, a sample a minute, each rule firing where it should and quiet where
# it should not.

rule_files:
  - ../router.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # conntrack: 90% full; another router at 50%.
      - series: 'node_nf_conntrack_entries{job="openwrt", instance="router:9100"}'
        values: '14745x20'
      - series: 'node_nf_conntrack_entries_limit{job="openwrt", instance="router:9100"}'
        values: '16384x20'
      - series: 'node_nf_conntrack_entries{job="openwrt", instance="ap:9100"}'
        values: '8192x20'
      - series: 'node_nf_conntrack_entries_limit{job="openwrt", instance="ap:9100"}'
        values: '16384x20'
      # meminfo: 5% available.
      - series: 'node_memory_MemAvailable_bytes{job="openwrt", instance="router:9100"}'
        values: '6553600x20'
      - series: 'node_memory_MemTotal_bytes{job="openwrt", instance="router:9100"}'
        values: '131072000x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: OpenWrtConntrackTableNearlyFull
        exp_alerts: []
      - eval_time: 15m
        alertname: OpenWrtConntrackTableNearlyFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: router:9100
            exp_annotations:
              summary: The connection table of router:9100 is 90% full.
              description: >-
                The conntrack table of router:9100 has been more than 80% full for 10 minutes.
                When it is full the router drops new connections. Raise net.netfilter.nf_conntrack_max,
                or find the host that opens them.
      - eval_time: 15m
        alertname: OpenWrtMemoryLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: router:9100
            exp_annotations:
              summary: router:9100 has 5% of its memory available.
              description: >-
                Less than 10% of the memory of router:9100 has been available for 10 minutes.
                /tmp is memory too: a full /tmp, or a large log, takes it.

  - interval: 1m
    input_series:
      # The overlay 5% available, the squashfs root full and read-only, /tmp
      # half used.
      - series: 'node_filesystem_avail_bytes{job="openwrt", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '1000000x20'
      - series: 'node_filesystem_size_bytes{job="openwrt", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '20000000x20'
      - series: 'node_filesystem_readonly{job="openwrt", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '0x20'
      - series: 'node_filesystem_avail_bytes{job="openwrt", instance="router:9100", device="/dev/root", fstype="squashfs", mountpoint="/rom"}'
        values: '0x20'
      - series: 'node_filesystem_size_bytes{job="openwrt", instance="router:9100", device="/dev/root", fstype="squashfs", mountpoint="/rom"}'
        values: '5000000x20'
      - series: 'node_filesystem_readonly{job="openwrt", instance="router:9100", device="/dev/root", fstype="squashfs", mountpoint="/rom"}'
        values: '1x20'
      - series: 'node_filesystem_avail_bytes{job="openwrt", instance="router:9100", device="tmpfs", fstype="tmpfs", mountpoint="/tmp"}'
        values: '50000000x20'
      - series: 'node_filesystem_size_bytes{job="openwrt", instance="router:9100", device="tmpfs", fstype="tmpfs", mountpoint="/tmp"}'
        values: '100000000x20'
      - series: 'node_filesystem_readonly{job="openwrt", instance="router:9100", device="tmpfs", fstype="tmpfs", mountpoint="/tmp"}'
        values: '0x20'
      # Inodes: the overlay 5% free; a jffs2 that reports none.
      - series: 'node_filesystem_files_free{job="openwrt", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '500x20'
      - series: 'node_filesystem_files{job="openwrt", instance="router:9100", device="/dev/ubi0_1", fstype="ubifs", mountpoint="/overlay"}'
        values: '10000x20'
      - series: 'node_filesystem_files_free{job="openwrt", instance="router:9100", device="/dev/mtdblock6", fstype="jffs2", mountpoint="/mnt/data"}'
        values: '0x20'
      - series: 'node_filesystem_files{job="openwrt", instance="router:9100", device="/dev/mtdblock6", fstype="jffs2", mountpoint="/mnt/data"}'
        values: '0x20'
      - series: 'node_filesystem_readonly{job="openwrt", instance="router:9100", device="/dev/mtdblock6", fstype="jffs2", mountpoint="/mnt/data"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenWrtFilesystemNearlyFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: router:9100
              device: /dev/ubi0_1
              fstype: ubifs
              mountpoint: /overlay
            exp_annotations:
              summary: /overlay on router:9100 has 5% of its space left.
              description: >-
                The filesystem at /overlay (/dev/ubi0_1, ubifs) on router:9100
                has had less than 10% of its space available for 15 minutes. On the overlay, packages and
                settings stop being written once it is full.
      - eval_time: 20m
        alertname: OpenWrtFilesystemOutOfInodes
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: router:9100
              device: /dev/ubi0_1
              fstype: ubifs
              mountpoint: /overlay
            exp_annotations:
              summary: /overlay on router:9100 has 5% of its inodes left.
              description: >-
                The filesystem at /overlay (/dev/ubi0_1) on router:9100 has had less
                than 10% of its inodes free for 15 minutes: many small files, as a growing cache or spool.

  - interval: 1m
    input_series:
      # A radio past its max, another past its crit, a chip with no limits
      # (0), and a CPU thermal zone past its passive trip point.
      - series: 'node_hwmon_temp_celsius{job="openwrt", instance="ap:9100", chip="mt7915_phy0", sensor="temp1"}'
        values: '110x10'
      - series: 'node_hwmon_temp_max_celsius{job="openwrt", instance="ap:9100", chip="mt7915_phy0", sensor="temp1"}'
        values: '105x10'
      - series: 'node_hwmon_temp_crit_celsius{job="openwrt", instance="ap:9100", chip="mt7915_phy0", sensor="temp1"}'
        values: '120x10'
      - series: 'node_hwmon_temp_celsius{job="openwrt", instance="ap:9100", chip="mt7915_phy1", sensor="temp1"}'
        values: '121x10'
      - series: 'node_hwmon_temp_max_celsius{job="openwrt", instance="ap:9100", chip="mt7915_phy1", sensor="temp1"}'
        values: '105x10'
      - series: 'node_hwmon_temp_crit_celsius{job="openwrt", instance="ap:9100", chip="mt7915_phy1", sensor="temp1"}'
        values: '120x10'
      - series: 'node_hwmon_temp_celsius{job="openwrt", instance="ap:9100", chip="soc", sensor="temp1"}'
        values: '50x10'
      - series: 'node_hwmon_temp_max_celsius{job="openwrt", instance="ap:9100", chip="soc", sensor="temp1"}'
        values: '0x10'
      - series: 'node_thermal_zone_temp{job="openwrt", instance="ap:9100", zone="0", type="cpu-thermal"}'
        values: '86x10'
      - series: 'node_thermal_zone_passive_celsius{job="openwrt", instance="ap:9100", zone="0", type="cpu-thermal"}'
        values: '85x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: OpenWrtTemperatureAboveMax
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: ap:9100
              chip: mt7915_phy0
              sensor: temp1
            exp_annotations:
              summary: Sensor temp1 of mt7915_phy0 on ap:9100 is at its maximum.
              description: >-
                Sensor temp1 of chip mt7915_phy0 on ap:9100 has read
                110 °C, at or above the chip's maximum, for 5 minutes. Check the airflow.
          - exp_labels:
              severity: warning
              job: openwrt
              instance: ap:9100
              chip: mt7915_phy1
              sensor: temp1
            exp_annotations:
              summary: Sensor temp1 of mt7915_phy1 on ap:9100 is at its maximum.
              description: >-
                Sensor temp1 of chip mt7915_phy1 on ap:9100 has read
                121 °C, at or above the chip's maximum, for 5 minutes. Check the airflow.
      - eval_time: 2m
        alertname: OpenWrtTemperatureCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openwrt
              instance: ap:9100
              chip: mt7915_phy1
              sensor: temp1
            exp_annotations:
              summary: Sensor temp1 of mt7915_phy1 on ap:9100 is at its critical temperature.
              description: >-
                Sensor temp1 of chip mt7915_phy1 on ap:9100 reads 121 °C,
                at or above the chip's critical temperature: the hardware may shut down.
      - eval_time: 6m
        alertname: OpenWrtThermalZoneThrottling
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: ap:9100
              zone: "0"
              type: cpu-thermal
            exp_annotations:
              summary: Thermal zone 0 (cpu-thermal) on ap:9100 is throttling.
              description: >-
                Thermal zone 0 (cpu-thermal) on ap:9100 has been at or above
                its passive trip point for 5 minutes, at 86 °C: the kernel slows the CPU to cool it.

  - interval: 1m
    input_series:
      # wan down, lan up.
      - series: 'node_openwrt_interface_up{job="openwrt", instance="router:9100", interface="wan"}'
        values: '1 0x10'
      - series: 'node_openwrt_interface_up{job="openwrt", instance="router:9100", interface="lan"}'
        values: '1x10'
      # radio0 has a network up, radio1 none.
      - series: 'node_wifi_radio_info{job="openwrt", instance="ap:9100", radio="radio0", htmode="HE80", channel="36", country="DE"}'
        values: '1x40'
      - series: 'node_wifi_network_info{job="openwrt", instance="ap:9100", radio="radio0", device="phy0-ap0", ssid="example", bssid="02:00:00:00:00:01", mode="Master"}'
        values: '1x40'
      - series: 'node_wifi_radio_info{job="openwrt", instance="ap:9100", radio="radio1", htmode="HE20", channel="1", country="DE"}'
        values: '1x40'
      # ntpd never synchronized; chronyd elsewhere is.
      - series: 'node_timesync_synchronized{job="openwrt", instance="router:9100", daemon="ntpd"}'
        values: '0x40'
      - series: 'node_timesync_synchronized{job="openwrt", instance="ap:9100", daemon="chronyd"}'
        values: '1x40'
      # 140 leases on lan, from dnsmasq and odhcpd; few on guest; many
      # DHCPv6 bindings, which take no pool.
      - series: 'node_openwrt_dhcp_leases{job="openwrt", instance="router:9100", server="dnsmasq", interface="lan", family="ipv4"}'
        values: '120x40'
      - series: 'node_openwrt_dhcp_leases{job="openwrt", instance="router:9100", server="odhcpd", interface="lan", family="ipv4"}'
        values: '20x40'
      - series: 'node_openwrt_dhcp_leases{job="openwrt", instance="router:9100", server="dnsmasq", interface="guest", family="ipv4"}'
        values: '12x40'
      - series: 'node_openwrt_dhcp_leases{job="openwrt", instance="router:9100", server="odhcpd", interface="lan", family="ipv6"}'
        values: '400x40'
    alert_rule_test:
      - eval_time: 7m
        alertname: OpenWrtWanDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: openwrt
              instance: router:9100
              interface: wan
            exp_annotations:
              summary: Interface wan of router:9100 is down.
              description: >-
                The logical interface wan of router:9100 has been down for 5 minutes.
                `ifstatus wan` on the router says why; node_openwrt_interface_errors counts
                the errors netifd holds for it.
      - eval_time: 15m
        alertname: OpenWrtWifiRadioDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: ap:9100
              radio: radio1
              htmode: HE20
              channel: "1"
              country: DE
            exp_annotations:
              summary: Wi-Fi radio radio1 of ap:9100 has no network up.
              description: >-
                Radio radio1 of ap:9100 has had no network up for 10 minutes:
                it is disabled, its driver failed, or it waits for a DFS channel check.
                `wifi status` on the router says which.
      - eval_time: 20m
        alertname: OpenWrtClockNotSynchronized
        exp_alerts: []
      - eval_time: 35m
        alertname: OpenWrtClockNotSynchronized
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: router:9100
              daemon: ntpd
            exp_annotations:
              summary: The clock of router:9100 is not synchronized.
              description: >-
                ntpd on router:9100 has not had the clock synchronized for 30 minutes:
                no NTP server answers, or none is set.
      - eval_time: 20m
        alertname: OpenWrtDhcpPoolNearlyExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openwrt
              instance: router:9100
              interface: lan
            exp_annotations:
              summary: The DHCP pool of lan on router:9100 is nearly exhausted.
              description: >-
                140 DHCPv4 leases are active on lan of router:9100, 90% of
                a pool of 150 addresses, OpenWrt's default. A new client gets no address once the pool is spent:
                raise the interface's `limit`, or shorten its `leasetime`.
