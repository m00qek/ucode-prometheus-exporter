name: ucode-prometheus-exporter

services:
  openwrt:
    image: ucode-prometheus-exporter-openwrt:${IMAGE_TAG}
    build:
      context: ./services/openwrt
      args:
        OPENWRT_ARCH: ${OPENWRT_ARCH}
        OPENWRT_VERSION: ${OPENWRT_VERSION}
        UCODE_ENGINE: ${UCODE_ENGINE}
    network_mode: none
    init: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ..:/exporter:ro
